agents_scanned:
  - name: "backend-agent"
    source: "project"
    description: "Expert backend engineer for RetroRocket's Express/TypeScript/Firebase/Vercel API server. Use PROACTIVELY for any work under retro-rocket/server/** or retro-rocket/api/**."
  - name: "docs-agent"
    source: "project"
    description: "Documentation expert for RetroRocket. Use PROACTIVELY to analyze a shipped or in-progress feature and write/maintain end-user-facing documentation — docs/*.md guides, README Key Features, spec-kit quickstart.md end-user framing."
  - name: "frontend-agent"
    source: "project"
    description: "Expert frontend engineer for RetroRocket's React/TypeScript UI. Use PROACTIVELY for any work under retro-rocket/src/** — components, pages, features, hooks, styling, routing, i18n, and design/motion (Apple HIG)."
  - name: "qa-agent"
    source: "project"
    description: "TDD/QA expert for RetroRocket. Use PROACTIVELY whenever a feature needs tests written before implementation, and for building/running/debugging Vitest, Playwright E2E, and accessibility (axe-core/WCAG 2.1 AA) coverage."


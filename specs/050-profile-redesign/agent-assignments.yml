agents_scanned:
  - name: "backend-agent"
    source: "project"
    description: "Expert backend engineer for RetroRocket's Express/TypeScript/Firebase/Vercel API server. Use PROACTIVELY for any work under retro-rocket/server/** or retro-rocket/api/** — new endpoints, use-cases, Firebase/Firestore/Redis access, session/auth, WebSocket handling, or anything touching the domain/application/adapters/http layering. Also use when asked to design or review backend architecture, ports/adapters boundaries, or Vercel deployment/build configuration for the server."
  - name: "frontend-agent"
    source: "project"
    description: "Expert frontend engineer for RetroRocket's React/TypeScript UI. Use PROACTIVELY for any work under retro-rocket/src/** — components, pages, features, hooks, styling, and especially anything involving visual design, layout, or motion/animation. Masters Apple Human Interface Guidelines design principles and MUST use this project's installed Apple-design skill package to make design/motion decisions rather than ad hoc judgment. Enforces WCAG 2.1 AA on every surface it touches."
  - name: "qa-agent"
    source: "project"
    description: "TDD/QA expert for RetroRocket. Use PROACTIVELY whenever a feature or bug fix needs tests written before implementation, whenever test coverage is unclear, and for building/running/debugging the full test suite — Vitest unit/component tests (frontend and server), Playwright E2E, accessibility (axe-core/WCAG 2.1 AA) scans, and the architecture guard tests. Use also to design a test plan for a new spec-kit feature, to diagnose flaky/failing tests, or to verify a change hasn't dropped coverage before merge."


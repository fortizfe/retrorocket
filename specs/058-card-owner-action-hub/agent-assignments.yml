agents_scanned:
  - name: "backend-agent"
    source: "project"
    description: "Expert backend engineer for RetroRocket's Express/TypeScript/Firebase/Vercel API server. Use PROACTIVELY for any work under retro-rocket/server/** or retro-rocket/api/**."
  - name: "docs-agent"
    source: "project"
    description: "Documentation expert for RetroRocket. Use PROACTIVELY to analyze a shipped or in-progress feature and write/maintain end-user-facing documentation."
  - name: "frontend-agent"
    source: "project"
    description: "Expert frontend engineer for RetroRocket's React/TypeScript UI. Use PROACTIVELY for any work under retro-rocket/src/** — components, hooks, styling, i18n, and design/motion (Apple HIG)."
  - name: "qa-agent"
    source: "project"
    description: "TDD/QA expert for RetroRocket. Use PROACTIVELY whenever a feature needs tests written before implementation, and for Vitest, Playwright E2E, and accessibility (axe-core/WCAG 2.1 AA) coverage."

